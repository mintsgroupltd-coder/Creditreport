version: "3.8"

# Local dev only: Postgres + the API. Run `docker compose up -d db`
# and run the backend with `npm run dev` on your host (faster iteration
# than rebuilding a Node image on every change), or `docker compose up`
# to run everything in containers.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: credit_report_analyzer
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/credit_report_analyzer?schema=public
      JWT_SECRET: dev-only-change-me
      JWT_EXPIRES_IN: 7d
      PORT: 4000
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "4000:4000"

volumes:
  db_data:
