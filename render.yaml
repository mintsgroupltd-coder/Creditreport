databases:
  - name: credit-report-db
    plan: free
    databaseName: credit_report_analyzer
    user: credit_report_analyzer

services:
  # Backend API (Node/Express, in the backend/ subdirectory)
  - type: web
    runtime: node
    name: credit-report-api
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: credit-report-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: PORT
        value: 4000
      - key: CORS_ORIGIN
        sync: false # set this to your frontend's URL after the first deploy (e.g. https://credit-report-frontend.onrender.com)

  # Frontend (Vite/React static build, in the frontend/ subdirectory)
  - type: web
    runtime: static
    name: credit-report-frontend
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # set this to your backend's URL after the first deploy (e.g. https://credit-report-api.onrender.com)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
